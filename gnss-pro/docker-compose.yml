services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${GNSS_DB_NAME:-gnss}
      MARIADB_USER: ${GNSS_DB_USER:-gnss}
      MARIADB_PASSWORD: ${GNSS_DB_PASSWORD:-gnss_local_change_me}
      MARIADB_ROOT_PASSWORD: ${GNSS_DB_ROOT_PASSWORD:-gnss_root_change_me}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:6-php8.3-apache
    ports:
      - "${GNSS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${GNSS_DB_NAME:-gnss}
      WORDPRESS_DB_USER: ${GNSS_DB_USER:-gnss}
      WORDPRESS_DB_PASSWORD: ${GNSS_DB_PASSWORD:-gnss_local_change_me}
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/themes/gnss-pro:/var/www/html/wp-content/themes/gnss-pro
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${GNSS_DB_NAME:-gnss}
      WORDPRESS_DB_USER: ${GNSS_DB_USER:-gnss}
      WORDPRESS_DB_PASSWORD: ${GNSS_DB_PASSWORD:-gnss_local_change_me}
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/themes/gnss-pro:/var/www/html/wp-content/themes/gnss-pro
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - cli

volumes:
  db_data:
  wordpress:
