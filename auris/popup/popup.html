<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AURIS</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="top">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="10" stroke="#8ef6d6" stroke-width="1.6"></circle>
          <circle cx="16" cy="16" r="4.5" fill="#c0b0ff"></circle>
          <path d="M16 4.5v3.2M16 24.3v3.2M4.5 16h3.2M24.3 16h3.2" stroke="#8ef6d6" stroke-width="1.4" stroke-linecap="round"></path>
        </svg>
      </div>
      <div>
        <div class="brand">AURIS</div>
        <p>Оценка новости появляется прямо на ссылке.</p>
      </div>
    </header>

    <section class="switch-row">
      <div>
        <strong>Показывать при наведении</strong>
        <span>Карточка с индексом достоверности</span>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" checked>
        <i></i>
      </label>
    </section>

    <section class="check">
      <button id="check-tab" type="button">Проверить вкладку</button>
      <label>
        <span>Или вставьте текст</span>
        <textarea id="paste" rows="4" maxlength="8000" placeholder="Абзац статьи, без адреса страницы"></textarea>
      </label>
      <button id="check-text" type="button">Проверить текст</button>
      <div id="check-result" hidden>
        <div class="score" data-score></div>
        <div class="item">
          <b data-label></b>
          <span data-summary></span>
          <span data-excerpt></span>
        </div>
      </div>
    </section>

    <form id="settings" autocomplete="off">
      <label>
        <span>Как считать</span>
        <select id="aiMode">
          <option value="auto">Авто: Nano, затем облако, затем локально</option>
          <option value="ondevice">Только Gemini Nano</option>
          <option value="cloud">Только облачный ИИ</option>
          <option value="local">Только локальные сигналы</option>
        </select>
      </label>

      <div class="split">
        <label>
          <span>Облако</span>
          <select id="provider">
            <option value="gemini">Gemini</option>
            <option value="openai">OpenAI-совместимый</option>
          </select>
        </label>
        <label>
          <span>Модель</span>
          <input id="model" type="text" placeholder="gemini-2.5-flash" spellcheck="false">
        </label>
      </div>

      <label>
        <span>Ключ API</span>
        <input id="apiKey" type="password" placeholder="Хранится только в этом браузере" autocomplete="off" spellcheck="false">
      </label>

      <label id="endpoint-field" hidden>
        <span>Endpoint</span>
        <input id="endpoint" type="url" placeholder="https://api.openai.com/v1/chat/completions" spellcheck="false">
      </label>

      <div class="checks">
        <label><input id="newsOnly" type="checkbox" checked> Только похожие на материал ссылки</label>
        <label><input id="deepFetch" type="checkbox" checked> Читать текст страницы по ссылке</label>
      </div>

      <label class="delay">
        <span>Пауза наведения <b id="delay-value">260 мс</b></span>
        <input id="hoverDelay" type="range" min="120" max="800" step="20" value="260">
      </label>

      <button id="test" type="button">Проверить модель</button>
      <p id="status" role="status">Ключ не уходит никуда, кроме выбранного провайдера. В модель уходят адрес, текст ссылки, заголовок, описание и фрагмент статьи.</p>
    </form>

    <section>
      <h2>Недавние</h2>
      <ul id="history">
        <li class="empty">Пока пусто. Наведите на заголовок новости.</li>
      </ul>
    </section>
  </body>
  <script type="module" src="popup.js"></script>
</html>
