[project]
name = "videograbber"
version = "1.2.0"
description = "Скачивает видео по ссылке в MP4. Веб-страница забирает ролик YouTube в MP4 или MP3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.12.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
videograbber = "videograbber.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videograbber = ["web_page.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
